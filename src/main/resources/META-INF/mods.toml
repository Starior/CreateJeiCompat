modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.createjeicompat]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.createjeicompat]]
modId="create"
mandatory=true
versionRange="[6.0.8,6.1.0)"
ordering="NONE"
side="BOTH"

# Do not declare mixinextras here. Forge 1.20.1 does not expose it as a loadable mod id;
# declaring it hard-fails dependency resolution. MixinExtras is still used at compile/runtime
# via Forge/Mixin (compileOnly in build.gradle). Why Forge treats the id this way is unclear.

# JEI is required: Create's sequenced-assembly UI is a JEI category; EMI shows it via JEmi.
[[dependencies.createjeicompat]]
modId="jei"
mandatory=true
versionRange="[15.0.0,)"
ordering="NONE"
side="CLIENT"

# Optional: same JEI category is wrapped by EMI's JEmi layer when EMI is installed.
[[dependencies.createjeicompat]]
modId="emi"
mandatory=false
versionRange="[1.1.0,)"
ordering="NONE"
side="CLIENT"

[[mixins]]
config="createjeicompat.mixins.json"
